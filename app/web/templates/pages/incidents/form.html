<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/incidents"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Multas
        </button>
        <h2 class="page-title">Nuevo Incidente</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="form-label">Auto <span class="text-[#F5A623]">*</span></label>
                <select name="vehicle_id" required class="form-control">
                    <option value="">Seleccionar...</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.plate }} - {{ v.brand }} {{ v.model }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Chofer</label>
                <select name="driver_id" class="form-control">
                    <option value="">Sin asignar</option>
                    {% for d in drivers %}
                    <option value="{{ d.id }}">{{ d.name }} ({{ d.dni }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Tipo <span class="text-[#F5A623]">*</span></label>
                <select name="type" required class="form-control">
                    <option value="">Seleccionar...</option>
                    <option value="multa">Multa</option>
                    <option value="accidente">Accidente</option>
                    <option value="reclamo">Reclamo</option>
                </select>
            </div>
            <div>
                <label class="form-label">Fecha <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="date" required placeholder="dd/mm/yyyy"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Costo</label>
                <input type="number" name="cost" value="0"
                       class="form-control no-spinner">
            </div>
            <div class="md:col-span-2">
                <label class="form-label">Descripción</label>
                <textarea name="description" rows="3"
                          class="form-control"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/incidents"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
