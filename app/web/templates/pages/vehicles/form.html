<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/vehicles"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Autos
        </button>
        <h2 class="page-title">{{ 'Editar' if vehicle else 'Nuevo' }} Auto</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="form-label">Marca <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="brand" required
                       value="{{ vehicle.brand if vehicle else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Modelo <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="model" required
                       value="{{ vehicle.model if vehicle else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Año <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="year" required min="0" max="{{ max_vehicle_year }}" class="form-control no-spinner"
                       value="{{ vehicle.year if vehicle else '' }}"
                       >
            </div>
            <div>
                <label class="form-label">Matrícula <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="plate" required
                       value="{{ vehicle.plate if vehicle else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Color</label>
                <input type="text" name="color"
                       value="{{ vehicle.color if vehicle else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Km actuales</label>
                <input type="number" name="current_km" min="0" class="form-control no-spinner"
                       value="{{ vehicle.current_km if vehicle else 0 }}"
                       >
            </div>
            {% if vehicle %}
            <div>
                <label class="form-label">Estado</label>
                <select name="status" class="form-control">
                    <option value="activo" {% if vehicle.status == 'activo' %}selected{% endif %}>Activo</option>
                    <option value="en_taller" {% if vehicle.status == 'en_taller' %}selected{% endif %}>En taller</option>
                    <option value="fuera_servicio" {% if vehicle.status == 'fuera_servicio' %}selected{% endif %}>Fuera de servicio</option>
                </select>
            </div>
            {% endif %}
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/vehicles"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
