<div id="main-content">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">{{ 'Editar' if vehicle else 'Nuevo' }} Vehículo</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#vehicles-table-container"
          hx-swap="innerHTML"
          class="bg-white rounded-xl shadow p-6 max-w-lg">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Marca *</label>
                <input type="text" name="brand" required
                       value="{{ vehicle.brand if vehicle else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Modelo *</label>
                <input type="text" name="model" required
                       value="{{ vehicle.model if vehicle else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Año *</label>
                <input type="number" name="year" required
                       value="{{ vehicle.year if vehicle else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Matrícula *</label>
                <input type="text" name="plate" required
                       value="{{ vehicle.plate if vehicle else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                <input type="text" name="color"
                       value="{{ vehicle.color if vehicle else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Km actuales</label>
                <input type="number" name="current_km"
                       value="{{ vehicle.current_km if vehicle else 0 }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            {% if vehicle %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select name="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="activo" {% if vehicle.status == 'activo' %}selected{% endif %}>Activo</option>
                    <option value="en_taller" {% if vehicle.status == 'en_taller' %}selected{% endif %}>En taller</option>
                    <option value="fuera_servicio" {% if vehicle.status == 'fuera_servicio' %}selected{% endif %}>Fuera de servicio</option>
                </select>
            </div>
            {% endif %}
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" hx-get="/vehicles" hx-target="#main-content" hx-swap="innerHTML"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                Guardar
            </button>
        </div>
    </form>
</div>
