{% extends "layouts/base.html" %}

{% block title %}Autos — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-4xl font-bold text-[#F5F0EB]">Autos</h2>
            <p class="text-lg text-[#989898] mt-2">Todos los vehículos de tu flota</p>
        </div>
        <button hx-get="/vehicles/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="bg-[#F5A623] hover:bg-[#E0950A] text-[#0A0A0A] px-6 py-3 rounded-xl text-lg font-bold transition-all duration-150 flex items-center gap-2">
            <i class="fas fa-plus"></i> Nuevo auto
        </button>
    </div>

    <div class="bg-[#141414] border border-[#262626] rounded-2xl overflow-hidden">
        <div id="vehicles-table-container">
            {% include "pages/vehicles/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
