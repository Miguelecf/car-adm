{% extends "layouts/base.html" %}

{% block title %}Autos — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="page-title">Autos</h2>
            <p class="page-subtitle">Todos los vehículos de tu flota</p>
        </div>
        <button hx-get="/vehicles/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="btn btn-primary px-6">
            <i class="fas fa-plus"></i> Nuevo auto
        </button>
    </div>

    <div class="table-shell">
        <div id="vehicles-table-container">
            {% include "pages/vehicles/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
