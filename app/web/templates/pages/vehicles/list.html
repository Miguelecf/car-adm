{% extends "layouts/base.html" %}

{% block title %}Vehículos - {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-3xl font-bold text-gray-800">Vehículos</h2>
            <p class="text-gray-500">Gestiona tu flota de taxis</p>
        </div>
        <button hx-get="/vehicles/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
            <i class="fas fa-plus mr-2"></i>Nuevo vehículo
        </button>
    </div>

    <div class="bg-white rounded-xl shadow">
        <div id="vehicles-table-container">
            {% include "pages/vehicles/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
