<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/contracts"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Contratos
        </button>
        <h2 class="page-title">{{ 'Editar' if contract else 'Nuevo' }} Contrato</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="form-label">Auto <span class="text-[#F5A623]">*</span></label>
                <select name="vehicle_id" required class="form-control">
                    <option value="">Seleccionar...</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}" {% if contract and contract.vehicle_id == v.id %}selected{% endif %}>
                        {{ v.plate }} - {{ v.brand }} {{ v.model }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Chofer <span class="text-[#F5A623]">*</span></label>
                <select name="driver_id" required class="form-control">
                    <option value="">Seleccionar...</option>
                    {% for d in drivers %}
                    <option value="{{ d.id }}" {% if contract and contract.driver_id == d.id %}selected{% endif %}>
                        {{ d.name }} ({{ d.dni }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Fecha inicio <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="start_date" required placeholder="dd/mm/yyyy"
                       value="{{ (contract.start_date | format_date_latam) if contract else '' }}"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Fecha fin</label>
                <input type="text" name="end_date" placeholder="dd/mm/yyyy"
                       value="{{ (contract.end_date | format_date_latam) if contract else '' }}"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Km al inicio <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="start_km" required
                       value="{{ contract.start_km if contract else '' }}"
                       class="form-control no-spinner">
            </div>
            <div>
                <label class="form-label">Km al fin</label>
                <input type="number" name="end_km"
                       value="{{ contract.end_km if contract else '' }}"
                       class="form-control no-spinner">
            </div>
            <div>
                <label class="form-label">Monto semanal <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="weekly_amount" required
                       value="{{ contract.weekly_amount if contract else '' }}"
                       class="form-control no-spinner">
            </div>
            <div>
                <label class="form-label">Depósito</label>
                <input type="number" name="deposit_amount"
                       value="{{ contract.deposit_amount if contract else 0 }}"
                       class="form-control no-spinner">
            </div>
            {% if contract %}
            <div>
                <label class="form-label">Estado</label>
                <select name="status" class="form-control">
                    <option value="activo" {% if contract.status == 'activo' %}selected{% endif %}>Activo</option>
                    <option value="finalizado" {% if contract.status == 'finalizado' %}selected{% endif %}>Finalizado</option>
                </select>
            </div>
            {% endif %}
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/contracts"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
