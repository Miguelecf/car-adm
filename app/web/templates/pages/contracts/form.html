<div id="main-content">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">{{ 'Editar' if contract else 'Nuevo' }} Contrato</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#contracts-table-container"
          hx-swap="innerHTML"
          class="bg-white rounded-xl shadow p-6 max-w-2xl">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vehículo *</label>
                <select name="vehicle_id" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Seleccionar...</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}" {% if contract and contract.vehicle_id == v.id %}selected{% endif %}>
                        {{ v.plate }} - {{ v.brand }} {{ v.model }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Chofer *</label>
                <select name="driver_id" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Seleccionar...</option>
                    {% for d in drivers %}
                    <option value="{{ d.id }}" {% if contract and contract.driver_id == d.id %}selected{% endif %}>
                        {{ d.name }} ({{ d.dni }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha inicio *</label>
                <input type="date" name="start_date" required
                       value="{{ contract.start_date if contract else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha fin</label>
                <input type="date" name="end_date"
                       value="{{ contract.end_date if contract else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Km al inicio *</label>
                <input type="number" name="start_km" required
                       value="{{ contract.start_km if contract else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Km al fin</label>
                <input type="number" name="end_km"
                       value="{{ contract.end_km if contract else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Monto semanal *</label>
                <input type="number" name="weekly_amount" required
                       value="{{ contract.weekly_amount if contract else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Depósito</label>
                <input type="number" name="deposit_amount"
                       value="{{ contract.deposit_amount if contract else 0 }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            {% if contract %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select name="status" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="activo" {% if contract.status == 'activo' %}selected{% endif %}>Activo</option>
                    <option value="finalizado" {% if contract.status == 'finalizado' %}selected{% endif %}>Finalizado</option>
                </select>
            </div>
            {% endif %}
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" hx-get="/contracts" hx-target="#main-content" hx-swap="innerHTML"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                Guardar
            </button>
        </div>
    </form>
</div>
