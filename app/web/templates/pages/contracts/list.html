{% extends "layouts/base.html" %}

{% block title %}Contratos - {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-3xl font-bold text-gray-800">Contratos</h2>
            <p class="text-gray-500">Gestiona los alquileres de vehículos</p>
        </div>
        <button hx-get="/contracts/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
            <i class="fas fa-plus mr-2"></i>Nuevo contrato
        </button>
    </div>

    <div class="bg-white rounded-xl shadow">
        <div id="contracts-table-container">
            {% include "pages/contracts/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
