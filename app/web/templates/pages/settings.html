{% extends "layouts/base.html" %}

{% block title %}Ajustes — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <h2 class="page-title">Ajustes</h2>
        <p class="page-subtitle">Configuración general</p>
    </div>

    <div class="form-card max-w-xl">
        {% if success %}
        <div class="bg-[#0F291E] border border-[#22C55E]/30 text-[#22C55E] px-5 py-4 rounded-xl mb-8 text-lg">
            ✅ Configuración guardada correctamente
        </div>
        {% endif %}

        <form hx-post="/settings" hx-target="#main-content" hx-swap="innerHTML" hx-select="#main-content">
            <div class="space-y-6">
                <div>
                    <label class="form-label">Día de cobro semanal</label>
                    <select name="payment_day" class="form-control">
                        <option value="0" {% if payment_day == 0 %}selected{% endif %}>Domingo</option>
                        <option value="1" {% if payment_day == 1 %}selected{% endif %}>Lunes</option>
                        <option value="2" {% if payment_day == 2 %}selected{% endif %}>Martes</option>
                        <option value="3" {% if payment_day == 3 %}selected{% endif %}>Miércoles</option>
                        <option value="4" {% if payment_day == 4 %}selected{% endif %}>Jueves</option>
                        <option value="5" {% if payment_day == 5 %}selected{% endif %}>Viernes</option>
                        <option value="6" {% if payment_day == 6 %}selected{% endif %}>Sábado</option>
                    </select>
                    <p class="form-help">Día en que se generan los cobros semanales automáticamente</p>
                </div>
            </div>

            <div class="flex justify-end mt-8">
                <button type="submit" class="btn btn-primary px-8">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
