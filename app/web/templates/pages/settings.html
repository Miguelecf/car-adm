{% extends "layouts/base.html" %}

{% block title %}Ajustes — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <h2 class="text-4xl font-bold text-[#F5F0EB]">Ajustes</h2>
        <p class="text-lg text-[#989898] mt-2">Configuración general</p>
    </div>

    <div class="bg-[#141414] border border-[#262626] rounded-2xl p-8 max-w-xl">
        {% if success %}
        <div class="bg-[#0F291E] border border-[#22C55E]/30 text-[#22C55E] px-5 py-4 rounded-xl mb-8 text-lg">
            ✅ Configuración guardada correctamente
        </div>
        {% endif %}

        <form hx-post="/settings" hx-target="#main-content" hx-swap="innerHTML" hx-select="#main-content">
            <div class="space-y-6">
                <div>
                    <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Día de cobro semanal</label>
                    <select name="payment_day" class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
                        <option value="0" {% if payment_day == 0 %}selected{% endif %}>Domingo</option>
                        <option value="1" {% if payment_day == 1 %}selected{% endif %}>Lunes</option>
                        <option value="2" {% if payment_day == 2 %}selected{% endif %}>Martes</option>
                        <option value="3" {% if payment_day == 3 %}selected{% endif %}>Miércoles</option>
                        <option value="4" {% if payment_day == 4 %}selected{% endif %}>Jueves</option>
                        <option value="5" {% if payment_day == 5 %}selected{% endif %}>Viernes</option>
                        <option value="6" {% if payment_day == 6 %}selected{% endif %}>Sábado</option>
                    </select>
                    <p class="text-base text-[#5C5C5C] mt-2">Día en que se generan los cobros semanales automáticamente</p>
                </div>
            </div>

            <div class="flex justify-end mt-8">
                <button type="submit"
                        class="px-8 py-3 bg-[#F5A623] hover:bg-[#E0950A] text-[#0A0A0A] text-lg font-bold rounded-xl transition-all duration-150">
                    Guardar cambios
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
