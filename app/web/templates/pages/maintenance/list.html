{% extends "layouts/base.html" %}

{% block title %}Servicio — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="page-title">Servicio</h2>
            <p class="page-subtitle">Historial y alertas de mantenimiento</p>
        </div>
        <button hx-get="/maintenance/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="btn btn-primary px-6">
            <i class="fas fa-plus"></i> Nuevo servicio
        </button>
    </div>

    <div class="table-shell">
        <div id="maintenance-table-container">
            {% include "pages/maintenance/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
