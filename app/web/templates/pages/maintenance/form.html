<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/maintenance"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="text-[#989898] hover:text-[#F5F0EB] text-lg mb-4 flex items-center gap-2 transition-colors duration-150">
            <i class="fas fa-arrow-left"></i> Volver a Servicio
        </button>
        <h2 class="text-4xl font-bold text-[#F5F0EB]">Nuevo Registro de Servicio</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#maintenance-table-container"
          hx-swap="innerHTML"
          class="bg-[#141414] border border-[#262626] rounded-2xl p-8 max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Auto <span class="text-[#F5A623]">*</span></label>
                <select name="vehicle_id" required class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
                    <option value="">Seleccionar...</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.plate }} - {{ v.brand }} {{ v.model }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Tipo <span class="text-[#F5A623]">*</span></label>
                <select name="type" required class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
                    <option value="">Seleccionar...</option>
                    <option value="aceite">Cambio de aceite</option>
                    <option value="filtros">Filtros</option>
                    <option value="frenos">Frenos</option>
                    <option value="llantas">Llantas</option>
                    <option value="correa">Correa</option>
                    <option value="otro">Otro</option>
                </select>
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Fecha del servicio <span class="text-[#F5A623]">*</span></label>
                <input type="date" name="service_date" required
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Km al servicio <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="km_at_service" required
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Costo</label>
                <input type="number" name="cost" value="0"
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Próximo km</label>
                <input type="number" name="next_service_km"
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150"
                       placeholder="Ej: 150000">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Próxima fecha</label>
                <input type="date" name="next_service_date"
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div class="md:col-span-2">
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Descripción</label>
                <textarea name="description" rows="3"
                          class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/maintenance"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="px-6 py-3 text-lg text-[#989898] hover:text-[#F5F0EB] hover:bg-[#1C1C1C] rounded-xl transition-all duration-150">
                Cancelar
            </button>
            <button type="submit"
                    class="px-8 py-3 bg-[#F5A623] hover:bg-[#E0950A] text-[#0A0A0A] text-lg font-bold rounded-xl transition-all duration-150">
                Guardar
            </button>
        </div>
    </form>
</div>
