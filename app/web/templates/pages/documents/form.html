<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/documents"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Documentos
        </button>
        <h2 class="page-title">Nuevo Documento</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-xl">
        <div class="space-y-6">
            <div>
                <label class="form-label">Auto <span class="text-[#F5A623]">*</span></label>
                <select name="vehicle_id" required class="form-control">
                    <option value="">Seleccionar...</option>
                    {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.plate }} - {{ v.brand }} {{ v.model }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Tipo <span class="text-[#F5A623]">*</span></label>
                <select name="type" required class="form-control">
                    <option value="">Seleccionar...</option>
                    <option value="seguro">Seguro</option>
                    <option value="itv">ITV / Verificación</option>
                    <option value="matricula">Matrícula</option>
                </select>
            </div>
            <div>
                <label class="form-label">Fecha de emisión <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="issue_date" required placeholder="dd/mm/yyyy"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Fecha de vencimiento <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="expiry_date" required placeholder="dd/mm/yyyy"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Notas</label>
                <textarea name="file_notes" rows="3"
                          class="form-control"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/documents"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
