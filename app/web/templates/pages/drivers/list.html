{% extends "layouts/base.html" %}

{% block title %}Choferes — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="page-title">Choferes</h2>
            <p class="page-subtitle">Personas que manejan tus autos</p>
        </div>
        <button hx-get="/drivers/new"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="btn btn-primary px-6">
            <i class="fas fa-plus"></i> Nuevo chofer
        </button>
    </div>

    <div class="table-shell">
        <div id="drivers-table-container">
            {% include "pages/drivers/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
