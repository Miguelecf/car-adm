<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/drivers"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Choferes
        </button>
        <h2 class="page-title">{{ 'Editar' if driver else 'Nuevo' }} Chofer</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
                <label class="form-label">Nombre completo <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="name" required
                       value="{{ driver.name if driver else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">DNI <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="dni" required
                       value="{{ driver.dni if driver else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Teléfono</label>
                <input type="text" name="phone"
                       value="{{ driver.phone if driver else '' }}"
                       class="form-control">
            </div>
            <div class="md:col-span-2">
                <label class="form-label">Dirección</label>
                <input type="text" name="address"
                       value="{{ driver.address if driver else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Nº Licencia</label>
                <input type="text" name="license_number"
                       value="{{ driver.license_number if driver else '' }}"
                       class="form-control">
            </div>
            <div>
                <label class="form-label">Vencimiento licencia</label>
                <input type="text" name="license_expiry" placeholder="dd/mm/yyyy"
                       value="{{ (driver.license_expiry | format_date_latam) if driver and driver.license_expiry else '' }}"
                       class="form-control datepicker">
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/drivers"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
