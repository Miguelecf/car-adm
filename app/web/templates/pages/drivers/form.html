<div id="main-content">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">{{ 'Editar' if driver else 'Nuevo' }} Chofer</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#drivers-table-container"
          hx-swap="innerHTML"
          class="bg-white rounded-xl shadow p-6 max-w-lg">
        <div class="grid grid-cols-2 gap-4">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Nombre completo *</label>
                <input type="text" name="name" required
                       value="{{ driver.name if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">DNI *</label>
                <input type="text" name="dni" required
                       value="{{ driver.dni if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                <input type="text" name="phone"
                       value="{{ driver.phone if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div class="col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
                <input type="text" name="address"
                       value="{{ driver.address if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Licencia</label>
                <input type="text" name="license_number"
                       value="{{ driver.license_number if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Vencimiento licencia</label>
                <input type="date" name="license_expiry"
                       value="{{ driver.license_expiry if driver else '' }}"
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" hx-get="/drivers" hx-target="#main-content" hx-swap="innerHTML"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                Guardar
            </button>
        </div>
    </form>
</div>
