{% extends "layouts/base.html" %}

{% block title %}Pagos - {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content">
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-3xl font-bold text-gray-800">Pagos</h2>
            <p class="text-gray-500">Controla los pagos semanales</p>
        </div>
        <div class="flex gap-3">
            <button hx-post="/payments/generate"
                    hx-target="#payments-table-container"
                    hx-swap="innerHTML"
                    class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition">
                <i class="fas fa-magic mr-2"></i>Generar semanal
            </button>
            <button hx-get="/payments/new"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg transition">
                <i class="fas fa-plus mr-2"></i>Nuevo pago
            </button>
        </div>
    </div>

    <div class="bg-white rounded-xl shadow">
        <div id="payments-table-container">
            {% include "pages/payments/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
