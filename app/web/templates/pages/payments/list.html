{% extends "layouts/base.html" %}

{% block title %}Cobros — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-4xl font-bold text-[#F5F0EB]">Cobros</h2>
            <p class="text-lg text-[#989898] mt-2">Pagos semanales de los choferes</p>
        </div>
        <div class="flex gap-3">
            <button hx-post="/payments/generate"
                    hx-target="#payments-table-container"
                    hx-swap="innerHTML"
                    class="bg-[#1C1C1C] hover:bg-[#262626] text-[#F5F0EB] border border-[#262626] px-5 py-3 rounded-xl text-lg font-medium transition-all duration-150 flex items-center gap-2">
                <i class="fas fa-magic"></i> Generar semanal
            </button>
            <button hx-get="/payments/new"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="bg-[#F5A623] hover:bg-[#E0950A] text-[#0A0A0A] px-6 py-3 rounded-xl text-lg font-bold transition-all duration-150 flex items-center gap-2">
                <i class="fas fa-plus"></i> Nuevo cobro
            </button>
        </div>
    </div>

    <div class="bg-[#141414] border border-[#262626] rounded-2xl overflow-hidden">
        <div id="payments-table-container">
            {% include "pages/payments/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
