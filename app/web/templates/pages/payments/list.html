{% extends "layouts/base.html" %}

{% block title %}Cobros — {{ settings.APP_NAME }}{% endblock %}

{% block content %}
<div id="main-content" data-current-path="{{ current_path }}">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="page-title">Cobros</h2>
            <p class="page-subtitle">Pagos semanales de los choferes</p>
        </div>
        <div class="flex gap-3">
            <button hx-post="/payments/generate"
                    hx-target="#payments-table-container"
                    hx-swap="innerHTML"
                    class="btn btn-muted px-5">
                <i class="fas fa-magic"></i> Generar semanal
            </button>
            <button hx-get="/payments/new"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-primary px-6">
                <i class="fas fa-plus"></i> Nuevo cobro
            </button>
        </div>
    </div>

    <div class="table-shell">
        <div id="payments-table-container">
            {% include "pages/payments/table.html" %}
        </div>
    </div>
</div>
{% endblock %}
