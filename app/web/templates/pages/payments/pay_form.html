<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/payments"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Cobros
        </button>
        <h2 class="page-title">Marcar como Pagado</h2>
    </div>

    <form hx-post="/payments/{{ payment_id }}/mark-paid"
          hx-target="#payments-table-container"
          hx-swap="innerHTML"
          class="form-card max-w-xl">
        <input type="hidden" name="payment_id" value="{{ payment_id }}">
        <div class="space-y-6">
            <div>
                <label class="form-label">Fecha de pago <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="payment_date" required placeholder="dd/mm/yyyy"
                       value="{{ today }}"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Método de pago <span class="text-[#F5A623]">*</span></label>
                <select name="method" required class="form-control">
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                </select>
            </div>
            <div>
                <label class="form-label">Notas</label>
                <textarea name="notes" rows="3"
                          class="form-control"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/payments"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-success px-8">
                Confirmar pago
            </button>
        </div>
    </form>
</div>
