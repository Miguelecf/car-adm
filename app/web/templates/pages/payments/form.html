<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/payments"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="page-back-link">
            <i class="fas fa-arrow-left"></i> Volver a Cobros
        </button>
        <h2 class="page-title">Registrar Cobro</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#main-content"
          hx-swap="innerHTML"
          hx-select="#main-content"
          class="form-card max-w-xl">
        <div class="space-y-6">
            <div>
                <label class="form-label">Contrato <span class="text-[#F5A623]">*</span></label>
                <select name="contract_id" required class="form-control">
                    <option value="">Seleccionar...</option>
                    {% for c in contracts %}
                    <option value="{{ c.id }}">
                        {{ c.vehicle.plate }} - {{ c.driver.name }} (${{ c.weekly_amount }}/sem)
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Monto <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="amount" required class="form-control no-spinner">
            </div>
            <div>
                <label class="form-label">Fecha límite <span class="text-[#F5A623]">*</span></label>
                <input type="text" name="due_date" required placeholder="dd/mm/yyyy"
                       class="form-control datepicker">
            </div>
            <div>
                <label class="form-label">Método de pago</label>
                <select name="method" class="form-control">
                    <option value="">Seleccionar...</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                </select>
            </div>
            <div>
                <label class="form-label">Notas</label>
                <textarea name="notes" rows="3"
                          class="form-control"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/payments"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="btn btn-secondary px-6">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary px-8">
                Guardar
            </button>
        </div>
    </form>
</div>
