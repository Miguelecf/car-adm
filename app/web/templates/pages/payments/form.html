<div id="main-content">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Registrar Pago</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#payments-table-container"
          hx-swap="innerHTML"
          class="bg-white rounded-xl shadow p-6 max-w-lg">
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Contrato *</label>
                <select name="contract_id" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Seleccionar...</option>
                    {% for c in contracts %}
                    <option value="{{ c.id }}">
                        {{ c.vehicle.plate }} - {{ c.driver.name }} (${{ c.weekly_amount }}/sem)
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Monto *</label>
                <input type="number" name="amount" required
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha límite *</label>
                <input type="date" name="due_date" required
                       class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Método de pago</label>
                <select name="method" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Seleccionar...</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Notas</label>
                <textarea name="notes" rows="2"
                          class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" hx-get="/payments" hx-target="#main-content" hx-swap="innerHTML"
                    class="px-4 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                Cancelar
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg transition">
                Guardar
            </button>
        </div>
    </form>
</div>
