<div id="main-content" data-current-path="{{ current_path }}">
    <div class="mb-8">
        <button type="button"
                hx-get="/payments"
                hx-target="#main-content"
                hx-swap="innerHTML"
                hx-select="#main-content"
                class="text-[#989898] hover:text-[#F5F0EB] text-lg mb-4 flex items-center gap-2 transition-colors duration-150">
            <i class="fas fa-arrow-left"></i> Volver a Cobros
        </button>
        <h2 class="text-4xl font-bold text-[#F5F0EB]">Registrar Cobro</h2>
    </div>

    <form hx-post="{{ action }}"
          hx-target="#payments-table-container"
          hx-swap="innerHTML"
          class="bg-[#141414] border border-[#262626] rounded-2xl p-8 max-w-xl">
        <div class="space-y-6">
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Contrato <span class="text-[#F5A623]">*</span></label>
                <select name="contract_id" required class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
                    <option value="">Seleccionar...</option>
                    {% for c in contracts %}
                    <option value="{{ c.id }}">
                        {{ c.vehicle.plate }} - {{ c.driver.name }} (${{ c.weekly_amount }}/sem)
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Monto <span class="text-[#F5A623]">*</span></label>
                <input type="number" name="amount" required
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Fecha límite <span class="text-[#F5A623]">*</span></label>
                <input type="date" name="due_date" required
                       class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Método de pago</label>
                <select name="method" class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150">
                    <option value="">Seleccionar...</option>
                    <option value="efectivo">Efectivo</option>
                    <option value="transferencia">Transferencia</option>
                </select>
            </div>
            <div>
                <label class="block text-lg font-medium text-[#F5F0EB] mb-2">Notas</label>
                <textarea name="notes" rows="3"
                          class="w-full px-4 py-3 bg-[#0A0A0A] border border-[#262626] rounded-xl text-lg text-[#F5F0EB] placeholder-[#5C5C5C] focus:border-[#F5A623] focus:ring-1 focus:ring-[#F5A623] focus:outline-none transition-colors duration-150"></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-4 mt-8">
            <button type="button"
                    hx-get="/payments"
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    hx-select="#main-content"
                    class="px-6 py-3 text-lg text-[#989898] hover:text-[#F5F0EB] hover:bg-[#1C1C1C] rounded-xl transition-all duration-150">
                Cancelar
            </button>
            <button type="submit"
                    class="px-8 py-3 bg-[#F5A623] hover:bg-[#E0950A] text-[#0A0A0A] text-lg font-bold rounded-xl transition-all duration-150">
                Guardar
            </button>
        </div>
    </form>
</div>
